<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.D.A.P.T. AI Coaching</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--bg), #e0ecff);
      color: var(--text);
      padding: 1.5rem;
    }

    .landing {
      max-width: 680px;
      width: 100%;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(37, 99, 235, 0.15);
      padding: 3rem 2rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .contact-btn {
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      padding: 0.85rem 1.4rem;
      border-radius: 10px;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    .contact-btn:hover,
    .contact-btn:focus {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <main class="landing">
    <h1>A.D.A.P.T. AI Coaching</h1>
    <p>
      Personalized AI coaching services to help professionals and teams learn practical AI workflows,
      boost productivity, and confidently apply emerging tools to real-world goals.
    </p>
    <a class="contact-btn" href="mailto:contact@adaptcoaching.ai">Contact Us</a>
  </main>
</body>
</html>
